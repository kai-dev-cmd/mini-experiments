<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    
    <!-- CUSTOMER PANEL -->
    <div id="customerPanel" class="panel">
      <div class="panel-header">Customers</div>
      <div id="customerBody" class="panel-body"></div>
    </div>

    <!-- MAIN APP PANEL -->
    <div id="mainPanel" class="panel">
      <div class="panel-header">Your Shop</div>
      <div id="mainBody" class="panel-body"></div>
    </div>

    <!-- INFO PANEL (TOGGLEABLE) -->
    <div id="infoPanel" class="panel hidden">
      <div
        class="panel-header"  
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <span>Info</span>
        <button data-action="close-info">X</button>
      </div>
      <div id="infoBody" class="panel-body"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
